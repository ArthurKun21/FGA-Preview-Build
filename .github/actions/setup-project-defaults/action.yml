name: Setup Project Defaults
description: Setup project defaults to enable the same setup across all jobs in the workflow.

inputs:
  java-version:
    description: Java version
    default: '21'
  distribution:
    description: Java distribution
    default: 'temurin'
  secret-pat:
    description: GitHub token or PAT
    required: true
  branch:
    description: Git branch to checkout
    default: 'development'

runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
        repository: 'ArthurKun21/FGA-Preview'
        token: ${{ inputs.secret-pat }}
        ref: ${{ inputs.branch }}

    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v6.4.0

    - name: Setup Java ${{ inputs.java-version }}
      uses: actions/setup-java@v6.1.0
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.distribution }}

    - name: Set up gradle
      uses: gradle/actions/setup-gradle@v6.4.0

    - name: Download latest FGA Data release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release download --repo ArthurKun21/fga-data --pattern '*.pb'

    - name: Move the downloaded FGA Data release to the correct location
      run: |
        mkdir -p data/src/commonMain/composeResources/files/atlas/
        mv *.pb data/src/commonMain/composeResources/files/atlas/
