name: Setup Project Defaults
description: Setup project defaults to enable the same setup across all jobs in the workflow.

inputs:
  java-version:
    description: Java version
    default: '21'
  distribution:
    description: Java distribution
    default: 'temurin'

runs:
  using: "composite"
  steps:
    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v6.4.0

    - name: Setup Java ${{ inputs.java-version }}
      uses: actions/setup-java@v6.1.0
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.distribution }}

    - name: Set up gradle
      uses: gradle/actions/setup-gradle@v6.4.0

    - name: Download FGA Data artifact
      uses: actions/download-artifact@v8.0.2
      with:
        name: fga-data

    - name: Move the downloaded FGA Data to the correct location
      shell: bash
      run: |
        mkdir -p data/src/commonMain/composeResources/files/atlas/
        mv *.pb data/src/commonMain/composeResources/files/atlas/
