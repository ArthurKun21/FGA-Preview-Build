name: Build Desktop
description: 'Build the Desktop release for the current OS and optionally upload its artifacts'

inputs:
  os:
    description: 'Runner OS from the workflow matrix, used to select which artifact to stage and upload'
    required: true
  github-token:
    description: 'GitHub token for the Maven GitHub package download'
    required: true
  upload-build:
    description: 'Whether to upload the build artifacts'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - id: prepare
      name: Prepare build
      shell: bash
      env:
        OS_INPUT: ${{ inputs.os }}
      run: |
        echo "commit-count=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
        case "$OS_INPUT" in
          windows-*) os_name=windows ;;
          ubuntu-*) os_name=linux ;;
          macos-*) os_name=macos ;;
          *) echo "Unsupported OS input: $OS_INPUT" >&2; exit 1 ;;
        esac
        echo "os-name=$os_name" >> "$GITHUB_OUTPUT"

    - name: Build Desktop Release
      shell: bash
      env:
        GITHUB_ACTOR: ${{ github.actor }} # For the Maven Github package download
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        ./gradlew :desktopApp:packageReleaseDistributionForCurrentOS

    # Stage the release artifacts at the repository root, renamed with the commit count, so the
    # upload step never depends on Compose's output layout
    - name: Stage Windows artifacts
      if: ${{ inputs.upload-build == 'true' && startsWith(inputs.os, 'windows') }}
      shell: pwsh
      env:
        COMMIT_COUNT: ${{ steps.prepare.outputs.commit-count }}
      run: |
        $dist = "desktopApp/build/compose/binaries/main-release"
        Move-Item "$dist/app/FGA-Preview" "FGA-Preview-${env:COMMIT_COUNT}"
        Compress-Archive -Path "FGA-Preview-${env:COMMIT_COUNT}" -DestinationPath "FGA-Preview-${env:COMMIT_COUNT}.zip" -Force
        Move-Item "$dist/msi/*.msi" "FGA-Preview-${env:COMMIT_COUNT}.msi"

    - name: Stage Linux artifacts
      if: ${{ inputs.upload-build == 'true' && startsWith(inputs.os, 'ubuntu') }}
      shell: bash
      env:
        COMMIT_COUNT: ${{ steps.prepare.outputs.commit-count }}
      run: |
        dist="desktopApp/build/compose/binaries/main-release"
        mv "$dist/deb/"*.deb "FGA-Preview-${COMMIT_COUNT}.deb"
        mv "$dist/app/FGA-Preview" "FGA-Preview-${COMMIT_COUNT}"
        # Native zip keeps the executable bits, so the app image stays runnable after extraction
        zip -r -q "FGA-Preview-${COMMIT_COUNT}.zip" "FGA-Preview-${COMMIT_COUNT}"

    - name: Stage macOS artifacts
      if: ${{ inputs.upload-build == 'true' && startsWith(inputs.os, 'macos') }}
      shell: bash
      env:
        COMMIT_COUNT: ${{ steps.prepare.outputs.commit-count }}
      run: |
        dist="desktopApp/build/compose/binaries/main-release"
        mv "$dist/dmg/"*.dmg "FGA-Preview-${COMMIT_COUNT}.dmg"
        mv "$dist/app/FGA-Preview.app" "FGA-Preview-${COMMIT_COUNT}.app"
        # ditto is the canonical way to zip a .app bundle: it preserves symlinks, permissions and
        # extended attributes; --keepParent stores the bundle as the zip root
        ditto -c -k --sequesterRsrc --keepParent \
          "FGA-Preview-${COMMIT_COUNT}.app" \
          "FGA-Preview-${COMMIT_COUNT}.zip"

    - name: Upload Build
      if: ${{ inputs.upload-build == 'true' }}
      uses: actions/upload-artifact@v7.0.2
      with:
        name: fga-ci-${{ steps.prepare.outputs.os-name }}-desktop-${{ steps.prepare.outputs.commit-count }}
        path: FGA-Preview-${{ steps.prepare.outputs.commit-count }}.*
