name: Download FGA Data
description: Download the latest FGA Data release and upload the files as an artifact.

runs:
  using: "composite"
  steps:
    - name: Download latest FGA Data release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release download --repo ArthurKun21/fga-data --pattern '*.pb'

    - name: Upload FGA Data artifact
      uses: actions/upload-artifact@v7.0.2
      with:
        name: fga-data
        path: '*.pb'
        retention-days: 1
