name: Dry Run

on:
  # Everyday at 00:00 UTC
  # schedule:
  #   - cron: '0 0 * * *'
  # Manual triggers
  workflow_dispatch:
    inputs:
      upload_build:
        description: 'Upload Build to GitHub Actions'
        required: false
        type: boolean
        default: false
      suggest_runtime:
        description: 'Suggest Runtime Modules'
        required: false
        type: boolean
        default: false
      repo_branch:
        description: 'Repository branch to build from'
        required: false
        default: 'development'

env:
  GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC"'

jobs:
  download-fga-data:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - name: Download FGA Data
        uses: $/.github/actions/download-fga-data

  android-app:
    needs: download-fga-data
    runs-on: ubuntu-latest
    permissions:
      contents: write
      discussions: write
    env:
      COMMIT_COUNT: 0
    steps:
      - name: Checkout FGA Preview
        uses: $/.github/actions/checkout-project
        with:
          secret-pat: ${{ secrets.PAT }}
          branch: ${{ github.event.inputs.repo_branch || 'development' }}

      - name: Setup project defaults
        uses: $/.github/actions/setup-project-defaults

      - name: Prepare build
        run: |
          commit_count=$(git rev-list --count HEAD)
          echo "COMMIT_COUNT=$commit_count" >> $GITHUB_ENV

      - name: Build Android Package
        env:
          GITHUB_ACTOR: ${{ github.actor }} # For the Maven Github package download
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew assembleCi --parallel

      - name: Upload Alpha
        if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.upload_build == 'true' || github.event.inputs.upload_build == true) }}
        uses: $/.github/actions/upload-alpha
        with:
          commit-count: ${{ env.COMMIT_COUNT }}
          upload-build: ${{ github.event.inputs.upload_build }}

  Desktop-App:
    needs: download-fga-data
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      discussions: write
    steps:
      - name: Checkout FGA Preview
        uses: $/.github/actions/checkout-project
        with:
          secret-pat: ${{ secrets.PAT }}
          branch: ${{ github.event.inputs.repo_branch || 'development' }}

      - name: Setup project defaults
        uses: $/.github/actions/setup-project-defaults

      - name: Suggest Runtime modules for ${{ matrix.os }}
        if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.suggest_runtime == 'true' || github.event.inputs.suggest_runtime == true) }}
        run: |
          ./gradlew :desktopApp:suggestRuntimeModules

      - name: Build and Upload Desktop for ${{ matrix.os }}
        uses: $/.github/actions/desktop-build
        with:
          os: ${{ matrix.os }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          upload-build: ${{ github.event.inputs.upload_build }}
