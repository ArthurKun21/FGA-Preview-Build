name: Dry Run

on:
  # Everyday at 00:00 UTC
  # schedule:
  #   - cron: '0 0 * * *'
  # Manual triggers
  workflow_dispatch:
    inputs:
      upload_build:
        description: 'Upload Build to GitHub Actions'
        required: false
        type: boolean
        default: false
      suggest_runtime:
        description: 'Suggest Runtime Modules'
        required: false
        type: boolean
        default: false
      repo_branch:
        description: 'Repository branch to build from'
        required: false
        default: 'development'

env:
  JAVA_VERSION: 25
  JAVA_DISTRO: 'temurin'

jobs:
  download-fga-data:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - name: Download FGA Data
        uses: $/.github/actions/download-fga-data

  android-app:
    needs: download-fga-data
    runs-on: macos-latest
    permissions:
      contents: write
      discussions: write
    env:
      COMMIT_COUNT: 0
    steps:
      - name: Checkout FGA Preview
        uses: $/.github/actions/checkout-project
        with:
          secret-pat: ${{ secrets.PAT }}
          branch: ${{ github.event.inputs.repo_branch || 'development' }}

      - name: Setup project defaults
        uses: $/.github/actions/setup-project-defaults

      - name: Prepare build
        run: |
          commit_count=$(git rev-list --count HEAD)
          echo "COMMIT_COUNT=$commit_count" >> $GITHUB_ENV

      - name: Build Android Package
        env:
          GITHUB_ACTOR: ${{ github.actor }} # For the Maven Github package download
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew assembleCi --parallel

      - name: Upload Alpha
        if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.upload_build == 'true' || github.event.inputs.upload_build == true) }}
        uses: $/.github/actions/upload-alpha
        with:
          commit-count: ${{ env.COMMIT_COUNT }}
          upload-build: ${{ github.event.inputs.upload_build }}

  Desktop-App:
    needs: download-fga-data
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      discussions: write
    env:
      COMMIT_COUNT: 0
    steps:
      - name: Checkout FGA Preview
        uses: $/.github/actions/checkout-project
        with:
          secret-pat: ${{ secrets.PAT }}
          branch: ${{ github.event.inputs.repo_branch || 'development' }}

      - name: Setup project defaults
        uses: $/.github/actions/setup-project-defaults

      - name: Prepare build (macos/ubuntu)
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest'
        run: |
          commit_count=$(git rev-list --count HEAD)
          echo "COMMIT_COUNT=$commit_count" >> $GITHUB_ENV

      - name: Prepare build (windows)
        if: matrix.os == 'windows-latest'
        run: |
          $commit_count = git rev-list --count HEAD
          "COMMIT_COUNT=$commit_count" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Suggest Runtime modules for ${{ matrix.os }}
        if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.suggest_runtime == 'true' || github.event.inputs.suggest_runtime == true) }}
        run: |
          ./gradlew :desktopApp:suggestRuntimeModules

      - name: Build Desktop Release for ${{ matrix.os }}
        env:
          GITHUB_ACTOR: ${{ github.actor }} # For the Maven Github package download
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :DesktopApp:packageReleaseDistributionForCurrentOS

      - name: Upload Windows Build
        if: >
          github.event_name == 'workflow_dispatch' &&
          (github.event.inputs.upload_build == 'true' || github.event.inputs.upload_build == true) &&
          startsWith(matrix.os, 'windows')
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fga-ci-windows-desktop-${{ env.COMMIT_COUNT }}
          path: ./desktopApp/build/compose/binaries/main-release/msi/*.msi
          # path: ./desktopApp/build/compose/binaries/main-release/portable/*.exe

      - name: Upload Linux Build
        if: >
          github.event_name == 'workflow_dispatch' &&
          (github.event.inputs.upload_build == 'true' || github.event.inputs.upload_build == true) &&
          startsWith(matrix.os, 'ubuntu')
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fga-ci-linux-desktop-${{ env.COMMIT_COUNT }}
          path: ./desktopApp/build/compose/binaries/main-release/**/*.deb

      - name: Upload Macos Build
        if: >
          github.event_name == 'workflow_dispatch' &&
          (github.event.inputs.upload_build == 'true' || github.event.inputs.upload_build == true) &&
          startsWith(matrix.os, 'macos')
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fga-ci-macos-desktop-${{ env.COMMIT_COUNT }}
          path: ./desktopApp/build/compose/binaries/main-release/**/*.dmg
