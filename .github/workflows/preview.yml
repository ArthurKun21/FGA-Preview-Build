name: Preview Build

on:
  # Manual triggers
  workflow_dispatch:
    inputs:
      repo_branch:
        description: 'Repository branch to build from'
        required: false
        default: 'development'

env:
  JAVA_VERSION: 21
  JAVA_DISTRO: 'temurin'

jobs:
  build-app:
    runs-on: macos-latest
    permissions:
      contents: write
      discussions: write
    env:
      COMMIT_COUNT: 0
    steps:
      - name: Checkout FGA Preview
        uses: ./.github/actions/checkout-project
        with:
          secret-pat: ${{ secrets.PAT }}
          branch: ${{ github.event.inputs.repo_branch || 'development' }}

      - name: Setup project defaults
        uses: ./.github/actions/setup-project-defaults

      - name: Prepare build
        run: |
          commit_count=$(git rev-list --count HEAD)
          echo "COMMIT_COUNT=$commit_count" >> $GITHUB_ENV
          current_sha=$(git rev-parse --short HEAD)
          echo "CURRENT_SHA=$current_sha" >> $GITHUB_ENV

          echo "FGA_VERSION_CODE=$commit_count" >>${GITHUB_ENV}
          echo "FGA_VERSION_NAME=$current_sha" >>${GITHUB_ENV}

      - name: Build Android Package
        env:
          GITHUB_ACTOR: ${{ github.actor }} # For the Maven Github package download
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew assemblePreview --parallel

      - name: Clean up build artifacts
        run: |
          cp app/build/outputs/apk/preview/app-universal-preview.apk fga-preview-${{ env.COMMIT_COUNT }}.apk

          cp app/build/outputs/apk/preview/app-arm64-v8a-preview.apk fga-preview-arm64-v8a-${{ env.COMMIT_COUNT }}.apk
          cp app/build/outputs/apk/preview/app-armeabi-v7a-preview.apk fga-preview-armeabi-v7a-${{ env.COMMIT_COUNT }}.apk
          cp app/build/outputs/apk/preview/app-x86_64-preview.apk fga-preview-x86_64-${{ env.COMMIT_COUNT }}.apk
          cp app/build/outputs/apk/preview/app-x86-preview.apk fga-preview-x86-${{ env.COMMIT_COUNT }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fga-preview-${{ env.COMMIT_COUNT }}-apk
          path: fga-preview-${{ env.COMMIT_COUNT }}.apk

      - name: Upload APK (arm64-v8a)
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fga-preview-arm64-v8a-${{ env.COMMIT_COUNT }}-apk
          path: fga-preview-arm64-v8a-${{ env.COMMIT_COUNT }}.apk

      - name: Upload APK (armeabi-v7a)
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fga-preview-armeabi-v7a-${{ env.COMMIT_COUNT }}-apk
          path: fga-preview-armeabi-v7a-${{ env.COMMIT_COUNT }}.apk

      - name: Upload APK (x86_64)
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fga-preview-x86_64-${{ env.COMMIT_COUNT }}-apk
          path: fga-preview-x86_64-${{ env.COMMIT_COUNT }}.apk

      - name: Upload APK (x86)
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fga-preview-x86-${{ env.COMMIT_COUNT }}-apk
          path: fga-preview-x86-${{ env.COMMIT_COUNT }}.apk
