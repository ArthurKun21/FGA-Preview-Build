name: Preview Build

on:
  # Manual triggers
  workflow_dispatch:
    inputs:
      repo_branch:
        description: 'Repository branch to build from'
        required: false
        default: 'development'

env:
  GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC"'

jobs:
  download-fga-data:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - name: Download FGA Data
        uses: $/.github/actions/download-fga-data

  build-app:
    needs: download-fga-data
    runs-on: ubuntu-latest
    permissions:
      contents: write
      discussions: write
    env:
      COMMIT_COUNT: 0
    steps:
      - name: Checkout FGA Preview
        uses: $/.github/actions/checkout-project
        with:
          secret-pat: ${{ secrets.PAT }}
          branch: ${{ github.event.inputs.repo_branch || 'development' }}

      - name: Setup project defaults
        uses: $/.github/actions/setup-project-defaults

      - name: Prepare build
        run: |
          commit_count=$(git rev-list --count HEAD)
          echo "COMMIT_COUNT=$commit_count" >> $GITHUB_ENV
          current_sha=$(git rev-parse --short HEAD)
          echo "CURRENT_SHA=$current_sha" >> $GITHUB_ENV

          echo "FGA_VERSION_CODE=$commit_count" >>${GITHUB_ENV}
          echo "FGA_VERSION_NAME=$current_sha" >>${GITHUB_ENV}

      - name: Build Android Package
        env:
          GITHUB_ACTOR: ${{ github.actor }} # For the Maven Github package download
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew assemblePreview --parallel

      - name: Upload Preview
        uses: $/.github/actions/upload-preview
        with:
          commit-count: ${{ env.COMMIT_COUNT }}
