name: Alpha Release App

on:
  # Every Saturday at 21:00 UTC
  # schedule:
  #   - cron: '0 21 * * 6'
  # Manual triggers
  workflow_dispatch:

env:
  GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC"'

jobs:
  download-fga-data:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - name: Download FGA Data
        uses: $/.github/actions/download-fga-data

  build-app:
    needs: download-fga-data
    runs-on: ubuntu-latest
    outputs:
      CREATE_RELEASE: ${{ steps.prepare_changelog.outputs.create-release }}
      CHANGELOG: ${{ steps.prepare_changelog.outputs.changelog }}
      COMMIT_COUNT_OUTPUT: ${{ steps.prepare_changelog.outputs.commit-count }}
    env:
      FGA_VERSION_CODE: 0
      FGA_VERSION_NAME: ''
    permissions:
      contents: write
      discussions: write
    steps:
      - name: Checkout FGA Preview
        uses: $/.github/actions/checkout-project
        with:
          secret-pat: ${{ secrets.PAT }}

      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          path: 'preview'
      - name: Prepare changelog
        id: prepare_changelog
        uses: $/.github/actions/prepare-changelog
        with:
          channel: alpha
          github-token: ${{ secrets.GITHUB_TOKEN }}
          secret-pat: ${{ secrets.PAT }}

      - name: Set FGA version
        env:
          COMMIT_COUNT: ${{ steps.prepare_changelog.outputs.commit-count }}
          CURRENT_SHA: ${{ steps.prepare_changelog.outputs.current-sha }}
        run: |
          echo "FGA_VERSION_CODE=$COMMIT_COUNT" >> "$GITHUB_ENV"
          echo "FGA_VERSION_NAME=$CURRENT_SHA" >> "$GITHUB_ENV"

      - name: Setup project defaults
        if: ${{ steps.prepare_changelog.outputs.commit-count-diff > 0 }}
        uses: $/.github/actions/setup-project-defaults

      - name: Build Android Package
        if: ${{ steps.prepare_changelog.outputs.commit-count-diff > 0 }}
        env:
          GITHUB_ACTOR: ${{ github.actor }} # For the Maven Github package download
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew assembleCi --parallel --no-daemon

      - name: Clean up build artifacts
        if: ${{ steps.prepare_changelog.outputs.commit-count-diff > 0 }}
        run: |
          COMMIT_COUNT=${{ steps.prepare_changelog.outputs.commit-count }}
          cp app/build/outputs/apk/ci/app-universal-ci.apk fga-preview-alpha-build-$COMMIT_COUNT.apk

          cp app/build/outputs/apk/ci/app-arm64-v8a-ci.apk fga-preview-alpha-build-arm64-v8a-$COMMIT_COUNT.apk
          cp app/build/outputs/apk/ci/app-armeabi-v7a-ci.apk fga-preview-alpha-build-armeabi-v7a-$COMMIT_COUNT.apk
          cp app/build/outputs/apk/ci/app-x86_64-ci.apk fga-preview-alpha-build-x86_64-$COMMIT_COUNT.apk
          cp app/build/outputs/apk/ci/app-x86-ci.apk fga-preview-alpha-build-x86-$COMMIT_COUNT.apk

      - name: Create release on forked repo
        uses: softprops/action-gh-release@v3.0.3
        if: ${{ steps.prepare_changelog.outputs.commit-count-diff > 0 }}
        with:
          tag_name: pre-${{ steps.prepare_changelog.outputs.commit-count }}-alpha
          name: FGA Preview - Alpha ${{ steps.prepare_changelog.outputs.commit-count }}
          repository: ArthurKun21/FGA
          body: |
            # Alpha-${{ steps.prepare_changelog.outputs.commit-count }}

            Check out our documentation website: https://arthurkun21.github.io/FGA-Preview-Build/

            ## Commits

            ${{ steps.prepare_changelog.outputs.commit-logs }}

            > [!IMPORTANT]
            >
            > This is an alpha build and may contain bugs.

            > [!TIP]
            >
            > If you are unsure which version to download then go with `fga-preview-alpha-build-${{ steps.prepare_changelog.outputs.commit-count }}.apk`
          files: |
            fga-preview-alpha-build-${{ steps.prepare_changelog.outputs.commit-count }}.apk
            fga-preview-alpha-build-arm64-v8a-${{ steps.prepare_changelog.outputs.commit-count }}.apk
            fga-preview-alpha-build-armeabi-v7a-${{ steps.prepare_changelog.outputs.commit-count }}.apk
            fga-preview-alpha-build-x86_64-${{ steps.prepare_changelog.outputs.commit-count }}.apk
            fga-preview-alpha-build-x86-${{ steps.prepare_changelog.outputs.commit-count }}.apk
          token: ${{ secrets.RELEASE_ON_ANOTHER_REPO }}

      - name: Create release
        uses: softprops/action-gh-release@v3.0.3
        if: ${{ steps.prepare_changelog.outputs.commit-count-diff > 0 }}
        with:
          tag_name: pre-${{ steps.prepare_changelog.outputs.commit-count }}-alpha
          name: FGA Preview - Alpha ${{ steps.prepare_changelog.outputs.commit-count }}
          body: |
            # Alpha-${{ steps.prepare_changelog.outputs.commit-count }}

            Check out our documentation website: https://arthurkun21.github.io/FGA-Preview-Build/

            ## Commits

            ${{ steps.prepare_changelog.outputs.commit-logs }}

            > [!IMPORTANT]
            >
            > This is an alpha build and may contain bugs.

            > [!TIP]
            >
            > If you are unsure which version to download then go with `fga-preview-alpha-build-${{ steps.prepare_changelog.outputs.commit-count }}.apk`
          files: |
            fga-preview-alpha-build-${{ steps.prepare_changelog.outputs.commit-count }}.apk
            fga-preview-alpha-build-arm64-v8a-${{ steps.prepare_changelog.outputs.commit-count }}.apk
            fga-preview-alpha-build-armeabi-v7a-${{ steps.prepare_changelog.outputs.commit-count }}.apk
            fga-preview-alpha-build-x86_64-${{ steps.prepare_changelog.outputs.commit-count }}.apk
            fga-preview-alpha-build-x86-${{ steps.prepare_changelog.outputs.commit-count }}.apk
          prerelease: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
