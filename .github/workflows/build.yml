name: Build Release App

on:
  # Every Saturday at 21:00 UTC
  # schedule:
  #   - cron: '0 21 * * 6'
  # Manual triggers
  workflow_dispatch:

env:
  GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC"'

jobs:
  build-app:
    runs-on: ubuntu-latest
    outputs:
      CREATE_RELEASE: ${{ steps.prepare_changelog.outputs.create-release }}
      CHANGELOG: ${{ steps.prepare_changelog.outputs.changelog }}
      COMMIT_COUNT_OUTPUT: ${{ steps.prepare_changelog.outputs.commit-count }}
    env:
      FGA_VERSION_CODE: 0
      FGA_VERSION_NAME: ''
    permissions:
      contents: write
      discussions: write
    steps:
      - name: Checkout FGA Preview
        uses: $/.github/actions/checkout-project
        with:
          secret-pat: ${{ secrets.PAT }}

      - name: Prepare changelog
        id: prepare_changelog
        uses: $/.github/actions/prepare-changelog
        with:
          channel: preview
          github-token: ${{ secrets.GITHUB_TOKEN }}
          secret-pat: ${{ secrets.PAT }}

      - name: Set FGA version
        env:
          COMMIT_COUNT: ${{ steps.prepare_changelog.outputs.commit-count }}
          CURRENT_SHA: ${{ steps.prepare_changelog.outputs.current-sha }}
        run: |
          echo "FGA_VERSION_CODE=$COMMIT_COUNT" >> "$GITHUB_ENV"
          echo "FGA_VERSION_NAME=$CURRENT_SHA" >> "$GITHUB_ENV"

      - name: Setup project defaults
        if: ${{ steps.prepare_changelog.outputs.commit-count-diff > 0 }}
        uses: $/.github/actions/setup-project-defaults

      - name: Build Android Package
        if: ${{ steps.prepare_changelog.outputs.commit-count-diff > 0 }}
        env:
          GITHUB_ACTOR: ${{ github.actor }} # For the Maven Github package download
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew assemblePreview --parallel --no-daemon

      - name: Upload Android release
        if: ${{ steps.prepare_changelog.outputs.commit-count-diff > 0 }}
        uses: $/.github/actions/upload-android-release
        with:
          commit-count: ${{ steps.prepare_changelog.outputs.commit-count }}
          artifact-prefix: fga-preview
          apk-variant: preview
          tag-name: pre-${{ steps.prepare_changelog.outputs.commit-count }}
          release-name: FGA Preview ${{ steps.prepare_changelog.outputs.commit-count }}
          body: |
            # Pre-${{ steps.prepare_changelog.outputs.commit-count }}

            Check out our documentation website: https://arthurkun21.github.io/FGA-Preview-Build/

            > [!TIP]
            > Check out our [CHANGELOG](https://github.com/ArthurKun21/FGA-Preview-Build/blob/main/CHANGELOG.md) for some of the past releases.

            > [!TIP]
            >
            > If you are unsure which version to download then go with `fga-preview-${{ steps.prepare_changelog.outputs.commit-count }}.apk`
          release-token: ${{ secrets.RELEASE_ON_ANOTHER_REPO }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # - name: Prune old releases
      #   uses: dev-drprasad/delete-older-releases@dfbe6be2a006e9475dfcbe5b8d201f1824c2a9fe # v0.3.4
      #   if: ${{ env.commit_count_diff > 0 }}
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   with:
      #     keep_latest: 28
      #     delete_tags: true

  changelog:
    runs-on: ubuntu-slim
    needs: build-app
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Update CHANGELOG.md
        if: ${{ needs.build-app.outputs.CREATE_RELEASE == 'true' }}
        env:
          CHANGELOG: ${{ needs.build-app.outputs.CHANGELOG }}
        run: |
          git switch -c update-release-${{ needs.build-app.outputs.COMMIT_COUNT_OUTPUT }}

          { printf '%s\n\n' "$CHANGELOG"; cat CHANGELOG.md; } > CHANGELOG.md

          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Use ISO-8601 format for consistency
          CURRENT_DATE_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Check if docs/changelog directory exists, create if not
          mkdir -p docs/changelog
          if ! touch docs/changelog/pre-${{ needs.build-app.outputs.COMMIT_COUNT_OUTPUT }}.md; then
            echo "Failed to create changelog file. Please check directory permissions or existence."
            exit 1
          fi

          printf '%s\n' "$CHANGELOG" > docs/changelog/pre-${{ needs.build-app.outputs.COMMIT_COUNT_OUTPUT }}.md

          git add CHANGELOG.md docs/changelog/pre-${{ needs.build-app.outputs.COMMIT_COUNT_OUTPUT }}.md
          git commit -m "Update CHANGELOG.md @ ${CURRENT_DATE_TIME}"
          git push -u origin update-release-${{ needs.build-app.outputs.COMMIT_COUNT_OUTPUT }}

      - name: Create pull request
        if: ${{ needs.build-app.outputs.CREATE_RELEASE == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_title="Release pre-${{ needs.build-app.outputs.COMMIT_COUNT_OUTPUT }}"
          pr_body="This PR creates a draft release for version pre-${{ needs.build-app.outputs.COMMIT_COUNT_OUTPUT }}."
          pr_branch="update-release-${{ needs.build-app.outputs.COMMIT_COUNT_OUTPUT }}"
          if ! gh pr create --head "${pr_branch}" --title "${pr_title}" --body "${pr_body}" --label release --draft; then
            echo "Failed to create pull request. Please check branch existence, authentication, or network connectivity."
            exit 1
          fi
