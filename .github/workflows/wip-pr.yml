name: WIP PR Alpha Release App

on:
  workflow_dispatch:
    inputs:
      repo_branch:
        description: 'Repository branch to build from'
        required: false
        default: 'development'

env:
  JAVA_VERSION: 21
  JAVA_DISTRO: 'temurin'

jobs:
  build-app:
    runs-on: macos-latest
    env:
      COMMIT_COUNT: 0
      FGA_VERSION_CODE: 1
      FGA_VERSION_NAME: '0.1.0'
      TIME_STAMP: ""
    permissions:
      contents: write
      discussions: write
    steps:
      - name: Checkout FGA Preview
        uses: $/.github/actions/checkout-project
        with:
          secret-pat: ${{ secrets.PAT }}
          branch: ${{ github.event.inputs.repo_branch || 'development' }}

      - name: Setup project defaults
        uses: $/.github/actions/setup-project-defaults

      - name: Prepare build
        id: prepare_build
        run: |
          commit_count=$(git rev-list --count HEAD)
          echo "COMMIT_COUNT=$commit_count" >> $GITHUB_ENV

          timestamp=$(date '+%Y-%m-%d')
          echo "TIME_STAMP=$timestamp" >> $GITHUB_ENV

      - name: Build Android Package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew assembleCi --parallel --no-daemon

      - name: Upload Alpha
        uses: $/.github/actions/upload-ci
        with:
          commit-count: ${{ env.COMMIT_COUNT }}
          artifact-prefix: fga-preview-wip-alpha-build

      - name: Create release on forked repo
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: wip-${{ env.COMMIT_COUNT }}-alpha-${{ env.TIME_STAMP }}
          name: FGA Preview - WIP ${{ env.COMMIT_COUNT }}-${{ env.TIME_STAMP }}
          repository: ArthurKun21/FGA
          body: |
            # WIP-Alpha-${{ env.COMMIT_COUNT }}

            > [!IMPORTANT]
            >
            > This is an alpha build and may contain bugs. Currently work-in-progress alpha build.

            > [!TIP]
            >
            > If you are unsure which version to download then go with `fga-preview-wip-alpha-build-${{ env.COMMIT_COUNT }}.apk`
          files: |
            fga-preview-wip-alpha-build-${{ env.COMMIT_COUNT }}.apk
            fga-preview-wip-alpha-build-arm64-v8a-${{ env.COMMIT_COUNT }}.apk
            fga-preview-wip-alpha-build-armeabi-v7a-${{ env.COMMIT_COUNT }}.apk
            fga-preview-wip-alpha-build-x86_64-${{ env.COMMIT_COUNT }}.apk
            fga-preview-wip-alpha-build-x86-${{ env.COMMIT_COUNT }}.apk
          prerelease: true
          draft: true
          token: ${{ secrets.RELEASE_ON_ANOTHER_REPO }}

      - name: Create release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: wip-${{ env.COMMIT_COUNT }}-alpha-${{ env.TIME_STAMP }}
          name: FGA Preview - WIP ${{ env.COMMIT_COUNT }}-${{ env.TIME_STAMP }}
          body: |
            # WIP-Alpha-${{ env.COMMIT_COUNT }}

            > [!IMPORTANT]
            >
            > This is an alpha build and may contain bugs. Currently work-in-progress alpha build.

            > [!TIP]
            >
            > If you are unsure which version to download then go with `fga-preview-wip-alpha-build-${{ env.COMMIT_COUNT }}.apk`
          files: |
            fga-preview-wip-alpha-build-${{ env.COMMIT_COUNT }}.apk
            fga-preview-wip-alpha-build-arm64-v8a-${{ env.COMMIT_COUNT }}.apk
            fga-preview-wip-alpha-build-armeabi-v7a-${{ env.COMMIT_COUNT }}.apk
            fga-preview-wip-alpha-build-x86_64-${{ env.COMMIT_COUNT }}.apk
            fga-preview-wip-alpha-build-x86-${{ env.COMMIT_COUNT }}.apk
          prerelease: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
